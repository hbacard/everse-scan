name: Bug report
description: Report a bug or unexpected behaviour in everse-scan
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide as much context as possible.
  - type: input
    id: version
    attributes:
      label: everse-scan version
      description: Output of `everse-scan --version`
      placeholder: "0.5.0"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did you run everse-scan?
      options:
        - Local repository
        - Remote GitHub repository
        - CI (GitHub Actions)
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened? Include error messages or stack traces.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran and any relevant repository details.
      placeholder: |
        1. `everse-scan ./my-repo --format json`
        2. ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, config files, or anything else that might help.
