[project]
name = "everse-scan"
version = "0.5.0"
description = "Research repository analysis tool: generates a structured report on software quality and FAIR compliance with EVERSE/RSQKit practices"
authors = [
    {name = "Hugo",email = "hugo.bacard@ijclab.in2p3.fr"},
]
dependencies = ["PyYAML>=6.0"]
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = {text = "MIT"}
keywords = ["everse", "rsqkit", "fair", "research-software", "quality", "scan"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
everse-scan = "everse_scan.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/everse_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["src/everse_scan"]
